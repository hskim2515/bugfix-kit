# bugfix-server 설정 예시. 복사해서 bugfix-kit.yml 로 쓰고, 비밀값은 환경변수로:
#   BUGFIX_GITHUB_TOKEN   GitHub PAT (classic, repo 권한) - 또는 github.tokenFile
#   BUGFIX_KEY_LHDT       프로젝트 lhdt 의 API 키 (X-Bugfix-Key) - 또는 projects.lhdt.apiKey

server:
  port: 8790
  dataDir: ./data            # 리포트 JSON 저장 (프로젝트별 하위 디렉터리)
  workDir: /data/bugfix-kit  # 저장소 사본·작업 worktree·node_modules 캐시
  claudeBin: claude          # PATH 에 없으면 절대 경로
  pathExtra: /home/gaia3d/.local/bin:/opt/java/jdk-21.0.2/bin
  javaHome: /opt/java/jdk-21.0.2
  model: ""                  # 비우면 claude 기본 모델
  maxTurns: 40
  timeoutMinutes: 45         # Claude 한 번 실행 상한 (후속 대화는 절반)
  verifyTimeoutMinutes: 20   # 검증 명령 하나당 상한
  runAsUser: ""              # 다른 계정으로 돌릴 때(sudo -n 필요). 보통 비움

github:
  tokenFile: ~/.config/bugfix-kit/github-token   # 한 줄, chmod 600

# 프로젝트별 비밀값은 서버의 ~/.config/bugfix-kit/projects/<이름>.env (KEY=VALUE, chmod 600) 에 둔다 - 저장소에는 안 들어간다.
#   BUGFIX_API_KEY=…      (apiKey 대신)   GITHUB_TOKEN=…  (이 프로젝트만 다른 토큰을 쓸 때)
#   FC_USER=… FC_PASS=…   (front-check 로그인 테스트 계정 - 저장소의 front-check.account 보다 우선)
projects:
  lhdt:
    # envFile: ~/.config/bugfix-kit/projects/lhdt.env   (기본값이라 생략 가능)
    repo: https://github.com/Gaia3D/lhdt.git
    githubRepo: Gaia3D/lhdt
    baseBranch: develop-new
    autoMerge: true
    cors: [https://lhdt.gaia3d.dev, http://localhost:8080, http://localhost:3000]
    description: "LHDT(3D GIS: Vue 3 + CesiumJS 프론트 `lhdt-user-front`, Spring Boot 4 + MyBatis 백엔드 `lhdt-rest`)"
    conventions: |
      - 주석은 한국어.
      - 프론트 SCSS 는 `lhdt-user-front/public/scss` 를 고친 뒤
        `cd lhdt-user-front/public/scss && sass main.scss ../css/ko/main.css --style=compressed --no-source-map` 로 빌드합니다
        (sass 는 PATH 에 있습니다. 안 되면 `../../node_modules/.bin/sass`). 빼먹어도 바깥에서 한 번 더 빌드합니다.
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    modules:
      - name: front
        match: lhdt-user-front/
        dir: lhdt-user-front
        nodeModulesCache: true
        prebuild:
          - when: lhdt-user-front/public/scss/
            cwd: lhdt-user-front/public/scss
            run: ../../node_modules/.bin/sass main.scss ../css/ko/main.css --style=compressed --no-source-map
        verify:
          - npx vue-cli-service lint --no-fix
          - npm run build-develop   # 어떤 모드로 빌드하는지 확인 - 검증·화면 확인이 운영 서버를 보게 하면 안 된다
      - name: back
        match: lhdt-rest/
        dir: .
        verify:
          - ./gradlew :lhdt-rest:compileJava -q
    # 검증 뒤 실제 화면 확인 (front-check). when 의 모듈이 바뀌었을 때만. 결과는 진행 로그·PR 본문에
    frontCheck:
      cwd: lhdt-user-front
      command: npx front-check check --context ../.bugfix/context.json --out ../.bugfix/after --json
      when: [front]
      timeoutMinutes: 10
    allowedTools:
      - "Bash(npx front-check:*)"
      - "Bash(npx vue-cli-service:*)"
      - "Bash(npx eslint:*)"
      - "Bash(./gradlew:*)"
      - "Bash(sass:*)"
      - "Bash(npx sass:*)"
      - "Bash(node_modules/.bin/sass:*)"
      - "Bash(../../node_modules/.bin/sass:*)"

  # 두 번째 프로젝트는 이 블록만 추가하면 된다
  # tnc:
  #   repo: https://github.com/Gaia3D/tnc.git
  #   githubRepo: Gaia3D/tnc
  #   baseBranch: develop
  #   modules:
  #     - { name: web, match: web/, dir: web, nodeModulesCache: true, verify: [npm run lint, npm run build] }
